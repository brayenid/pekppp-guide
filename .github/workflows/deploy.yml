name: Deploy Pekppp to cPanel

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy to cPanel (pekppp only)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Install Dependencies
        run: npm ci

      - name: 4. Generate Prisma & Build Next.js (Standalone)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          npx prisma generate
          npm run build

      - name: 5. Prepare Standalone Deployment Package
        run: |
          mkdir -p deploy-pkg
          # 1. Salin seluruh isi standalone (server.js, node_modules minimal, bundle)
          cp -r .next/standalone/* deploy-pkg/
          # 2. Salin folder static assets ke .next/static
          mkdir -p deploy-pkg/.next/static
          cp -r .next/static/* deploy-pkg/.next/static/
          # 3. Salin folder public
          cp -r public deploy-pkg/public
          # 4. Buat trigger restart untuk Phusion Passenger cPanel
          mkdir -p deploy-pkg/tmp
          touch deploy-pkg/tmp/restart.txt

      - name: 6. Deploy Strictly to pekppp.kutaibaratkab.go.id via SSH / rsync
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.CPANEL_HOST }}
          REMOTE_USER: ${{ secrets.CPANEL_USER }}
          REMOTE_PORT: ${{ secrets.CPANEL_PORT || 22 }}
          # SOURCE dari folder paket lokal
          SOURCE: "deploy-pkg/"
          # TARGET DIKUNCI HANYA ke direktori subdomain pekppp (TIDAK menyentuh folder tetangga seperti dashboardrealisasi)
          TARGET: "/home/${{ secrets.CPANEL_USER }}/public_html/pekppp.kutaibaratkab.go.id/"
          # Parameter rsync aman: TANPA flag --delete agar TIDAK ADA file apapun yang dihapus di server
          ARGS: "-rlgoDzvc"
          # Pengecualian: Lindungi file .env dan .htaccess agar tidak terhapus/tertimpa
          EXCLUDE: "/.env, /.env.*, /.htaccess, /tmp/restart.txt"

      - name: 7. Restart Application in cPanel
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          port: ${{ secrets.CPANEL_PORT || 22 }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Trigger restart hanya pada folder pekppp
          script: |
            touch /home/${{ secrets.CPANEL_USER }}/public_html/pekppp.kutaibaratkab.go.id/tmp/restart.txt
