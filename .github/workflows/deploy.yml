name: Build and Push Standalone to Deploy Branch

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build Next.js & Publish Deploy Branch
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Install Dependencies
        run: npm ci

      - name: 4. Generate Prisma & Build Next.js (Standalone)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          npx prisma generate
          npm run build

      - name: 5. Prepare Standalone Deployment Package
        run: |
          mkdir -p deploy-pkg
          # 1. Salin seluruh isi standalone termasuk folder tersembunyi .next (menggunakan ./)
          cp -r .next/standalone/. deploy-pkg/
          # 2. Salin static assets ke .next/static
          mkdir -p deploy-pkg/.next/static
          cp -r .next/static/* deploy-pkg/.next/static/
          # 3. Salin folder public
          cp -r public deploy-pkg/public
          # 4. Buat file app.js (symlink) agar Passenger cPanel otomatis mendeteksi server.js
          ln -sf server.js deploy-pkg/app.js
          # 5. Buat trigger restart untuk Phusion Passenger cPanel
          mkdir -p deploy-pkg/tmp
          touch deploy-pkg/tmp/restart.txt
          # 6. Buat .gitignore agar .env dan .htaccess di cPanel tidak tertimpa/terhapus
          cat << 'EOF' > deploy-pkg/.gitignore
          .env
          .env.*
          .htaccess
          EOF

      - name: 6. Push Compiled Output to 'production-deploy' Branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd deploy-pkg
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b production-deploy
          git add -A
          git commit -m "deploy: standalone build for commit ${{ github.sha }}"
          git push -f https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git production-deploy
